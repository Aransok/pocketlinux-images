# Light desktop image, shown to users as "Desktop Light". About 2 GB unpacked.
name: debian-xfce
display_name: Desktop Light
version: 0.1.0
base: debian-trixie
arch: arm64
desktop: xfce
min_ram_mb: 3072
install_recommends: false
packages:
  # desktop (selected pieces of xfce4-goodies, no heavy extras)
  - xfce4
  - xfce4-terminal
  - xfce4-notifyd
  - xfce4-taskmanager
  - xfce4-screenshooter
  - xfce4-clipman
  - thunar
  - mousepad
  - ristretto
  - gvfs
  - adwaita-icon-theme
  - dbus
  - dbus-x11
  - firefox-esr
  # audio, graphics, X helpers
  - pulseaudio-utils
  - libpulse0
  - libgl1-mesa-dri
  - mesa-vulkan-drivers
  - mesa-utils
  - x11-xserver-utils
  # keyboard layouts for the X server of Pocket Linux Display (it embeds xkbcomp)
  - xkb-data
  - x11-utils
  - xauth
  - xdg-utils
  # fonts
  - fonts-dejavu
  - fonts-noto-core
  # dev stack
  - git
  - python3
  - python3-pip
  - python3-venv
  - nodejs
  - npm
  - build-essential
  # base userland
  - sudo
  - passwd
  - locales
  - bash
  - bash-completion
  - coreutils
  - procps
  - iproute2
  - curl
  - wget
  - ca-certificates
  - nano
  - less
  - xz-utils
  - unzip
  - zip
hooks:
  - 10-base
  - 20-scripts
  - 40-desktop-tweaks
  - 90-slim
